name: LeaseLedger CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and tests
        run: python -m compileall -q leaseledger tests
      - name: Multi-process concurrency and regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify packaging and CLI
        run: |
          python -m pip install -e .
          leaseledger --help

  benchmark-smoke:
    name: Reproducible benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run measured benchmark with consistency checks
        run: python -m benchmarks.queue_bench --jobs 80 --workers 4


  lint:
    name: Ruff quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned dev linter
        run: python -m pip install "ruff==0.14.1"
      - name: Verify lint rules
        run: ruff check leaseledger tests benchmarks examples
      - name: Verify consistent formatting
        run: ruff format --check leaseledger tests benchmarks examples
