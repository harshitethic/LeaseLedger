name: LeaseLedger CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and tests
        run: python -m compileall -q leaseledger tests scripts
      - name: Multi-process concurrency and regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify packaging, CLI and reproducible recovery demonstration
        run: |
          python -m pip install -e .
          leaseledger --help
          python -m examples.recovery_walkthrough
          python -m unittest tests.test_recovery_walkthrough -v

  benchmark-smoke:
    name: Reproducible benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run measured benchmark with consistency checks
        run: |
          python -m benchmarks.queue_bench --jobs 80 --workers 4
          python -m benchmarks.workload_bench --jobs 24 --workers 1,2 --handler-ms 0,2 --repeats 2 --retry-every 4 > workload-smoke.json
      - name: Preserve the measured workload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workload-smoke-${{ github.sha }}
          path: workload-smoke.json
          if-no-files-found: error
          retention-days: 14


  lint:
    name: Ruff quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned dev linter
        run: python -m pip install "ruff==0.14.1"
      - name: Verify lint rules
        run: ruff check leaseledger tests benchmarks examples scripts
      - name: Verify consistent formatting
        run: ruff format --check leaseledger tests benchmarks examples scripts

  security:
    name: CodeQL gate
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  release:
    name: Publish verified version
    needs: [test, benchmark-smoke, lint, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'harshitethic/LeaseLedger'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: leaseledger-version-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Publish immutable version from its changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_release.py
