[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leaseledger"
version = "0.1.0"
description = "Durable SQLite task queue with fenced leases, retries, and audit events"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name="Harshit Sharma"}]
keywords = ["sqlite", "queue", "leases", "fencing", "at-least-once", "workers"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
leaseledger = "leaseledger.cli:main"

[tool.setuptools.packages.find]
include = ["leaseledger*"]

[tool.ruff]
line-length = 110
target-version = "py311"
